<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doseday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070707; --fg:#fff; --dim:#b8b8b8; --accent:#ffd400; --ok:#5cff8a; --bad:#ff6b6b;
          --card:#141414; --card2:#1c1c1c; --line:#3a3a3a; --viam:#ff9d2e; --yolo:#7fb8ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:20px/1.35 "Atkinson Hyperlegible", system-ui, sans-serif; }
  button { font:inherit; font-weight:700; border:3px solid var(--fg); background:#222; color:var(--fg);
           border-radius:14px; padding:10px 14px; cursor:pointer; min-height:56px; }
  button:focus-visible { outline:5px solid var(--accent); outline-offset:3px; }
  button:active { transform:translateY(1px); }
  h2 { margin:0 0 12px; font-size:16px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }

  header { display:flex; gap:14px; align-items:center; padding:14px 20px; border-bottom:2px solid var(--line); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; margin-right:auto; }
  .brand h1 { margin:0; font-size:34px; color:var(--accent); line-height:1; }
  #status { display:inline-flex; align-items:center; gap:10px; border:2px solid var(--line); border-radius:999px;
            padding:8px 16px; font-size:20px; font-weight:700; }
  #status::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--ok); }
  #status.busy { border-color:var(--accent); color:var(--accent); }
  #status.busy::before { background:var(--accent); animation:pulse 1s infinite; }
  #status.down { border-color:var(--bad); color:var(--bad); }
  #status.down::before { background:var(--bad); }
  #mic { background:#003d80; border-color:#7fb8ff; }
  #mic.listening { background:var(--accent); color:#000; }
  #stop { background:#c00000; border-color:#ff9a9a; font-size:28px; min-width:160px; }
  #alarm { background:var(--bad); color:#000; font-weight:700; font-size:26px; padding:14px 20px; }

  .wrap { padding:20px; display:grid; gap:20px; max-width:1600px; margin:0 auto; }
  .top { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:20px; }
  .card { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px; min-width:0; }

  [hidden] { display:none !important; }
  /* the frame box hugs the image, so detection boxes in % of the frame land on it */
  .cam { position:relative; background:#000; border:2px solid var(--line); border-radius:14px; overflow:hidden;
         width:fit-content; max-width:100%; margin:0 auto; }
  .cam img { display:block; max-width:100%; max-height:42vh; width:auto; height:auto; }
  .cam .ph { width:min(560px, 80vw); aspect-ratio:4/3; max-height:42vh; display:grid; place-items:center; color:var(--dim); }
  #boxes { position:absolute; inset:0; pointer-events:none; }
  .box { position:absolute; border:4px solid; border-radius:6px; }
  .box span { position:absolute; left:-4px; bottom:100%; font-size:15px; font-weight:700; color:#000; padding:1px 6px;
              border-radius:4px 4px 0 0; white-space:nowrap; }
  .box.viam { border-color:var(--viam); } .box.viam span { background:var(--viam); }
  .box.yolov8 { border-color:var(--yolo); border-style:dashed; } .box.yolov8 span { background:var(--yolo); top:100%; bottom:auto; border-radius:0 0 4px 4px; }
  .dets { list-style:none; margin:14px 0 0; padding:0; display:grid; gap:8px; }
  .dets li { display:flex; justify-content:space-between; gap:12px; background:var(--card2); border-radius:12px; padding:10px 14px; }
  .dets li b { text-align:right; }
  .dets .viam span::before, .dets .yolov8 span::before { content:""; display:inline-block; width:14px; height:14px;
      border-radius:3px; margin-right:10px; vertical-align:-1px; }
  .dets .viam span::before { background:var(--viam); } .dets .yolov8 span::before { background:var(--yolo); }

  #now { display:flex; flex-direction:column; gap:18px; }
  #now-pill { display:flex; align-items:center; gap:18px; min-height:80px; }
  #now-pill .name { font-size:44px; font-weight:700; line-height:1.1; }
  #now-title { font-size:34px; font-weight:700; line-height:1.2; }
  #now-title.idle { color:var(--dim); }
  #now-last { font-size:24px; margin-top:auto; }
  #now-last.ok { color:var(--ok); } #now-last.bad { color:var(--bad); }

  /* the two demo pills: Tums are round, orange or red; magnesium is a white capsule */
  .pill { display:inline-block; flex:none; }
  .pill.tums { width:26px; height:26px; border-radius:50%; background:linear-gradient(90deg,#ff8a00 50%,#e0262b 50%); }
  .pill.magnesium { width:38px; height:18px; border-radius:9px; background:#f4f4ef; }
  .pill.big.tums { width:72px; height:72px; } .pill.big.magnesium { width:104px; height:48px; border-radius:24px; }
  .pill.unknown { width:26px; height:26px; border-radius:50%; border:3px dashed var(--dim); }

  #days { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:12px; }
  .day { background:var(--card2); border:3px solid var(--line); border-radius:16px; padding:12px; display:flex;
         flex-direction:column; gap:10px; min-width:0; }
  .day.today { border-color:var(--accent); }
  .day h3 { margin:0; font-size:28px; line-height:1; }
  .tray { min-height:60px; border-radius:12px; background:#0b0b0b; border:2px dashed var(--line); display:flex;
          flex-wrap:wrap; gap:6px; align-items:center; justify-content:center; padding:8px; }
  .day.lid-closed .tray { border-style:solid; border-color:#777; background:repeating-linear-gradient(135deg,#262626 0 8px,#1a1a1a 8px 16px); }
  .lid { font-size:17px; font-weight:700; color:var(--ok); }
  .day.lid-closed .lid { color:var(--fg); } .day.lid-unknown .lid { color:var(--bad); }
  .day button { width:100%; min-height:50px; padding:6px 8px; font-size:18px; display:flex; align-items:center;
                justify-content:center; gap:8px; }
  .day button { flex-wrap:wrap; min-width:0; overflow:hidden; }
  .day button .pill.tums { width:20px; height:20px; } .day button .pill.magnesium { width:28px; height:14px; }
  #now-pill:empty { display:none; }
  .place { background:#1d1d00; border-color:var(--accent); color:var(--accent); }
  .day:not(.lid-open) .place, .day.lid-closed [data-a=close], .day.lid-open [data-a=opened] { display:none; }
  footer { color:#8a8a8a; font-size:15px; text-align:center; padding:0 20px 24px; }

  @keyframes pulse { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  @media (max-width:1200px) { #days { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); } }
  @media (max-width:900px) { .top { grid-template-columns:1fr; } }
  @media (max-width:600px) { body { font-size:18px; } .wrap { padding:12px; gap:14px; } header { padding:12px; }
    .brand h1 { font-size:28px; } #stop { min-width:0; flex:1; } #now-title { font-size:28px; } #days { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <clipPath id="cap"><rect x="4" y="14" width="36" height="16" rx="8"/></clipPath>
      <g clip-path="url(#cap)"><rect x="4" y="14" width="18" height="16" fill="#ffd400"/><rect x="22" y="14" width="18" height="16" fill="#fff"/></g>
    </svg>
    <h1>Doseday</h1>
  </div>
  <div id="status" role="status" aria-live="polite">Connecting…</div>
  <button id="mic" aria-label="Speak a command">🎤</button>
  <button id="stop" aria-label="Stop the robot now">STOP</button>
</header>
<div id="alarm" role="alert" hidden></div>

<div class="wrap">
  <div class="top">
    <section class="card" aria-labelledby="cam-h">
      <h2 id="cam-h">What the camera sees</h2>
      <div class="cam">
        <img id="cam" alt="Wrist camera view of the pill tray" hidden>
        <div id="boxes"></div>
        <div class="ph" id="cam-ph">No pill on the tray yet</div>
      </div>
      <ul class="dets" id="dets"></ul>
    </section>

    <section class="card" id="now" aria-labelledby="now-h">
      <h2 id="now-h">Now</h2>
      <div id="now-pill"></div>
      <div id="now-title" class="idle">Ready</div>
      <div id="now-last"></div>
    </section>
  </div>

  <section class="card" aria-labelledby="week-h">
    <h2 id="week-h">The week</h2>
    <div id="days"></div>
  </section>
</div>
<footer>Demo with candy and vitamins only. Not medical advice. Spooky Civic Hackathon 2026 · Team 02</footer>

<script>
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const NAMES = {sun:"Sunday",mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday"};
const PILLS = ["tums","magnesium"];
const SOURCES = {viam:"Viam colour detector", yolo:"YOLOv8", yolov8:"YOLOv8"};
let lastSpoken = 0, lastLook = null;

function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u);
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const icon = (p, big) => `<span class="pill ${PILLS.includes(p) ? p : "unknown"}${big ? " big" : ""}" aria-hidden="true"></span>`;

async function post(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && j.say) say(j.say);
  return j;
}

const STOP_TRIES = 3;
const STOP_FAILED = "STOP FAILED. The arm may still be moving.";

async function sendStop() {
  try {
    const r = await fetch("/stop", {method:"POST"});
    const j = await r.json().catch(() => ({}));
    return r.ok && j.ok === true;
  } catch (e) {
    return false;
  }
}

// "Stopped" is said only after the server confirms; a failure stays on screen until a stop succeeds.
async function stopArm() {
  say("Stopping");
  let done = false;
  for (let i = 0; i < STOP_TRIES && !done; i++) done = await sendStop();
  if (done) { showAlarm(""); say("Stopped"); return; }
  showAlarm(STOP_FAILED); say(STOP_FAILED);
}

function showAlarm(text) {
  const el = document.getElementById("alarm");
  el.textContent = text; el.hidden = !text;
}

function cmd(action, day, pill) {
  const words = action === "place" ? `Putting ${pill} in ${NAMES[day]}` :
                action === "home" ? "Going home" :
                action === "opened" ? `Marking ${NAMES[day]} open` :
                action === "open" ? `Lids start open. Please open ${NAMES[day]} by hand` : `Closing ${NAMES[day]}`;
  if (action === "open") { say(words); return; }
  say(words);
  return post("/cmd", {action, day, pill});
}

function build() {
  const main = document.getElementById("days");
  const today = DAYS[new Date().getDay()];
  for (const d of DAYS) {
    const card = document.createElement("div");
    card.id = `day-${d}`;
    card.className = "day lid-open" + (d === today ? " today" : "");
    card.innerHTML = `<h3>${NAMES[d].slice(0,3)}</h3>
      <div class="tray" id="tray-${d}"></div>
      <span class="lid" id="lid-${d}">Lid open</span>
      ${PILLS.map(p => `<button class="place" data-a="place" data-p="${p}" aria-label="Put ${p} in ${NAMES[d]}">${icon(p)}${cap(p)}</button>`).join("")}
      <button data-a="close" aria-label="Close ${NAMES[d]}'s lid">Close lid</button>
      <button data-a="opened" aria-label="${NAMES[d]} was opened by hand">Opened by hand</button>`;
    card.querySelectorAll("button").forEach(b => b.onclick = () => cmd(b.dataset.a, d, b.dataset.p));
    main.appendChild(card);
  }
  document.getElementById("stop").onclick = stopArm;
  const cam = document.getElementById("cam");
  cam.onerror = () => { cam.hidden = true; document.getElementById("cam-ph").hidden = false; };
  cam.onload = () => { cam.hidden = false; document.getElementById("cam-ph").hidden = true; };
}

// Detections are drawn over the frame they were made on; they are for show and never decide a placement.
function renderLook(look, detectors) {
  const dets = (look && look.detections) || [];
  const [w, h] = (look && look.size) || [640, 480];
  document.getElementById("boxes").innerHTML = dets.map(d => {
    const [x0, y0, x1, y1] = d.box;
    return `<div class="box ${esc(d.source)}" style="left:${x0 / w * 100}%;top:${y0 / h * 100}%;width:${(x1 - x0) / w * 100}%;height:${(y1 - y0) / h * 100}%">`
         + `<span>${esc(d.label)} ${Math.round(d.confidence * 100)}%</span></div>`;
  }).join("");
  document.getElementById("dets").innerHTML = (detectors || []).map(src => {
    const mine = dets.filter(d => d.source === src || (src === "yolo" && d.source === "yolov8"));
    const found = !look ? "–" : mine.length ? mine.map(d => `${esc(d.label)} · ${Math.round(d.confidence * 100)}%`).join(", ") : "nothing found";
    return `<li class="${src === "yolo" ? "yolov8" : esc(src)}"><span>${SOURCES[src] || esc(src)}</span><b>${found}</b></li>`;
  }).join("");
  if (look && look.t !== lastLook) {
    lastLook = look.t;
    document.getElementById("cam").src = `/frame.jpg?t=${look.t}`;
  }
}

function renderWeek(s) {
  const placed = {};
  for (const r of s.results) if (r.ok && r.action === "place" && r.day) (placed[r.day] = placed[r.day] || []).push(r.pill);
  const today = DAYS[new Date().getDay()];
  for (const d of DAYS) {
    const state = s.lids[d] || "unknown";
    document.getElementById(`day-${d}`).className = `day lid-${state}` + (d === today ? " today" : "");
    document.getElementById(`lid-${d}`).textContent = state === "open" ? "Lid open" : state === "closed" ? "Lid closed" : `Lid ${state}: check it`;
    document.getElementById(`tray-${d}`).innerHTML = (placed[d] || []).map(p => icon(p)).join("");
  }
}

function renderNow(s) {
  const c = s.busy, newest = s.results[0];
  const pill = c && c.action === "place" ? c.pill : null;
  document.getElementById("now-pill").innerHTML = pill ? `${icon(pill, true)}<span class="name">${esc(cap(pill))}</span>` : "";
  const title = document.getElementById("now-title");
  title.textContent = !c ? "Ready" : c.action === "place" ? `→ ${NAMES[c.day]}` : c.action === "close" ? `Closing ${NAMES[c.day]}`
                    : c.action === "home" ? "Going home" : `${cap(c.action)} ${NAMES[c.day] || ""}`;
  title.className = c ? "" : "idle";
  const last = document.getElementById("now-last");
  last.textContent = newest ? `${newest.ok ? "✓" : "✗"} ${newest.say}` : "";
  last.className = newest ? (newest.ok ? "ok" : "bad") : "";
}

async function poll() {
  try {
    const s = await (await fetch("/status")).json();
    const st = document.getElementById("status");
    st.textContent = s.busy ? `Working: ${s.busy.action}${s.busy.day ? " " + NAMES[s.busy.day.slice(0,3).toLowerCase()] : ""}`
                            + (s.queued ? ` (+${s.queued} waiting)` : "") : "Ready";
    st.className = s.busy ? "busy" : "";
    renderNow(s);
    renderWeek(s);
    renderLook(s.look, s.detectors);
    const newest = s.results[0];
    if (newest && newest.id > lastSpoken) { lastSpoken = newest.id; say(newest.say); }
  } catch (e) {
    document.getElementById("status").textContent = "Robot server not reachable";
    document.getElementById("status").className = "down";
  }
  setTimeout(poll, 700);
}

function parse(text) {
  const t = text.toLowerCase();
  if (/\b(stop|halt|freeze)\b/.test(t)) return {stop: true};
  // after the stop check on purpose: "no, stop" must still stop the arm
  if (/\b(not|never|no|don'?t|do not)\b/.test(t)) return {error: "I heard 'not' or 'no'. Say the whole command again without it."};
  const days = new Set();
  const today = new Date().getDay();
  if (/\btoday\b/.test(t)) days.add(DAYS[today]);
  if (/\btomorrow\b/.test(t)) days.add(DAYS[(today + 1) % 7]);
  for (const d of DAYS) if (new RegExp(`\\b${NAMES[d].toLowerCase()}|\\b${d}\\b`).test(t)) days.add(d);
  // two days in one utterance is a correction or an ambiguity: refuse, never guess which one was meant
  if (days.size > 1) return {error: "I heard more than one day. Say one day."};
  const pills = new Set(PILLS.filter(p => t.includes(p)));
  if (/\btum/.test(t)) pills.add("tums");
  if (pills.size > 1) return {error: "I heard more than one pill. Say one pill."};
  const intents = [];
  if (/\bhome\b/.test(t)) intents.push("home");
  if (pills.size && /\b(put|place|add|fill|load|give)\b/.test(t)) intents.push("place");
  if (/\b(open|unlock)\b/.test(t)) intents.push("open");
  if (/\b(close|shut|lock)\b/.test(t)) intents.push("close");
  if (intents.length > 1) return {error: "I heard more than one command. Say one at a time."};
  if (intents[0] === "home") return {action: "home"};
  return {action: intents[0] || null, day: days.size ? [...days][0] : null, pill: pills.size ? [...pills][0] : null};
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  if (!SR) { mic.disabled = true; mic.hidden = true; return; }
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    const c = parse(text);
    if (c.error) { say(c.error); return; }
    if (c.stop) { stopArm(); return; }
    if (!c.action || (c.action !== "home" && !c.day)) { say(`Sorry, I heard "${text}". Say a day and open, close, or a pill.`); return; }
    cmd(c.action, c.day, c.pill);
  };
  rec.onend = () => mic.classList.remove("listening");
  mic.onclick = () => { mic.classList.add("listening"); rec.start(); };
}

build(); setupMic(); poll();
</script>
</body>
</html>
