<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doseday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --fg:#fff; --dim:#bbb; --accent:#ffd400; --ok:#5cff8a; --bad:#ff6b6b; --card:#151515; --line:#444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:22px/1.35 "Atkinson Hyperlegible", system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:16px; border-bottom:2px solid var(--line); flex-wrap:wrap; }
  h1 { margin:0; font-size:34px; color:var(--accent); letter-spacing:.5px; }
  #status { flex:1; min-width:240px; font-size:26px; font-weight:700; }
  button { font:inherit; font-weight:700; border:3px solid var(--fg); background:#222; color:var(--fg);
           border-radius:14px; padding:14px 18px; cursor:pointer; min-height:64px; }
  button:focus-visible { outline:5px solid var(--accent); outline-offset:3px; }
  button:active { transform:translateY(1px); }
  #stop { background:#c00000; border-color:#ff9a9a; font-size:30px; min-width:180px; }
  #mic { background:#003d80; border-color:#7fb8ff; }
  #mic.listening { background:var(--accent); color:#000; }
  main { padding:16px; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:16px; }
  .day { background:var(--card); border:2px solid var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .day h2 { margin:0; font-size:30px; display:flex; justify-content:space-between; align-items:baseline; }
  .lid { font-size:18px; color:var(--dim); font-weight:400; }
  .lid.open { color:var(--ok); }
  .row { display:flex; gap:10px; }
  .row button { flex:1; }
  .place { background:#1d1d00; border-color:var(--accent); color:var(--accent); }
  .small { font-size:18px; font-weight:400; }
  section { padding:0 16px 24px; }
  #log { list-style:none; padding:0; margin:0; font-size:20px; }
  #log li { padding:8px 0; border-bottom:1px solid var(--line); }
  #log .ok { color:var(--ok); } #log .bad { color:var(--bad); }
  .hint { color:var(--dim); font-size:18px; }
  #alarm { background:var(--bad); color:#000; font-weight:700; font-size:26px; padding:14px 16px; }
  @media (max-width:600px) { body { font-size:20px; } h1 { font-size:28px; } }
</style>
</head>
<body>
<header>
  <h1>Doseday</h1>
  <div id="status" role="status" aria-live="polite">Connecting…</div>
  <button id="mic" aria-label="Speak a command">🎤 Speak</button>
  <button id="stop" aria-label="Stop the robot now">STOP</button>
</header>
<div id="alarm" role="alert" hidden></div>
<main id="days"></main>
<section>
  <p class="hint">Lids start open. Say: “put Tums in Monday”, “close Friday”, “go home”, or “stop”.</p>
  <ul id="log" aria-live="polite"></ul>
</section>
<script>
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const NAMES = {sun:"Sunday",mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday"};
const PILLS = ["tums","magnesium"];
let lastSpoken = 0;

function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u);
}

async function post(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok && j.say) say(j.say);
  return j;
}

const STOP_TRIES = 3;
const STOP_FAILED = "STOP FAILED. The arm may still be moving.";

async function sendStop() {
  try {
    const r = await fetch("/stop", {method:"POST"});
    const j = await r.json().catch(() => ({}));
    return r.ok && j.ok === true;
  } catch (e) {
    return false;
  }
}

// "Stopped" is said only after the server confirms; a failure stays on screen until a stop succeeds.
async function stopArm() {
  say("Stopping");
  let done = false;
  for (let i = 0; i < STOP_TRIES && !done; i++) done = await sendStop();
  if (done) { showAlarm(""); say("Stopped"); return; }
  showAlarm(STOP_FAILED); say(STOP_FAILED);
}

function showAlarm(text) {
  const el = document.getElementById("alarm");
  el.textContent = text; el.hidden = !text;
}

function cmd(action, day, pill) {
  const words = action === "place" ? `Putting ${pill} in ${NAMES[day]}` :
                action === "home" ? "Going home" :
                action === "opened" ? `Marking ${NAMES[day]} open` :
                action === "open" ? `Lids start open. Please open ${NAMES[day]} by hand` : `Closing ${NAMES[day]}`;
  if (action === "open") { say(words); return; }
  say(words);
  return post("/cmd", {action, day, pill});
}

function build() {
  const main = document.getElementById("days");
  for (const d of DAYS) {
    const card = document.createElement("div");
    card.className = "day";
    card.innerHTML = `<h2>${NAMES[d]} <span class="lid" id="lid-${d}">lid ?</span></h2>
      <div class="row"><button data-a="close">Close lid</button><button data-a="opened" class="small">Opened by hand</button></div>
      ${PILLS.map(p => `<button class="place" data-a="place" data-p="${p}">+ ${p[0].toUpperCase()+p.slice(1)}</button>`).join("")}`;
    card.querySelectorAll("button").forEach(b => b.onclick = () => cmd(b.dataset.a, d, b.dataset.p));
    main.appendChild(card);
  }
  document.getElementById("stop").onclick = stopArm;
}

async function poll() {
  try {
    const s = await (await fetch("/status")).json();
    const st = document.getElementById("status");
    st.textContent = s.busy ? `Working: ${s.busy.action}${s.busy.day ? " " + NAMES[s.busy.day.slice(0,3).toLowerCase()] : ""}`
                            + (s.queued ? ` (+${s.queued} waiting)` : "") : "Ready";
    for (const d of DAYS) {
      const el = document.getElementById(`lid-${d}`);
      el.textContent = `lid ${s.lids[d]}`; el.className = "lid" + (s.lids[d] === "open" ? " open" : "");
    }
    document.getElementById("log").innerHTML = s.results.map(r =>
      `<li class="${r.ok ? "ok" : "bad"}">${r.t} · ${r.say}</li>`).join("");
    const newest = s.results[0];
    if (newest && newest.id > lastSpoken) { lastSpoken = newest.id; say(newest.say); }
  } catch (e) {
    document.getElementById("status").textContent = "Robot server not reachable";
  }
  setTimeout(poll, 700);
}

function parse(text) {
  const t = text.toLowerCase();
  if (/\b(stop|halt|freeze)\b/.test(t)) return {stop: true};
  // after the stop check on purpose: "no, stop" must still stop the arm
  if (/\b(not|never|no|don'?t|do not)\b/.test(t)) return {error: "I heard 'not' or 'no'. Say the whole command again without it."};
  const days = new Set();
  const today = new Date().getDay();
  if (/\btoday\b/.test(t)) days.add(DAYS[today]);
  if (/\btomorrow\b/.test(t)) days.add(DAYS[(today + 1) % 7]);
  for (const d of DAYS) if (new RegExp(`\\b${NAMES[d].toLowerCase()}|\\b${d}\\b`).test(t)) days.add(d);
  // two days in one utterance is a correction or an ambiguity: refuse, never guess which one was meant
  if (days.size > 1) return {error: "I heard more than one day. Say one day."};
  const pills = new Set(PILLS.filter(p => t.includes(p)));
  if (/\btum/.test(t)) pills.add("tums");
  if (pills.size > 1) return {error: "I heard more than one pill. Say one pill."};
  const intents = [];
  if (/\bhome\b/.test(t)) intents.push("home");
  if (pills.size && /\b(put|place|add|fill|load|give)\b/.test(t)) intents.push("place");
  if (/\b(open|unlock)\b/.test(t)) intents.push("open");
  if (/\b(close|shut|lock)\b/.test(t)) intents.push("close");
  if (intents.length > 1) return {error: "I heard more than one command. Say one at a time."};
  if (intents[0] === "home") return {action: "home"};
  return {action: intents[0] || null, day: days.size ? [...days][0] : null, pill: pills.size ? [...pills][0] : null};
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  if (!SR) { mic.disabled = true; mic.textContent = "No voice in this browser"; return; }
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = e => {
    const text = e.results[0][0].transcript;
    const c = parse(text);
    if (c.error) { say(c.error); return; }
    if (c.stop) { stopArm(); return; }
    if (!c.action || (c.action !== "home" && !c.day)) { say(`Sorry, I heard "${text}". Say a day and open, close, or a pill.`); return; }
    cmd(c.action, c.day, c.pill);
  };
  rec.onend = () => mic.classList.remove("listening");
  mic.onclick = () => { mic.classList.add("listening"); rec.start(); };
}

build(); setupMic(); poll();
</script>
</body>
</html>
