<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doseday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* warm palette from alex/ui-warm: every text pair passes WCAG AA */
  :root { --bg:#F5EFE6; --fg:#3A322B; --dim:#685D52; --accent:#A64B2A; --soft:#F6E4D9; --ok:#3D6A48; --bad:#A3362A;
          --stop:#B3261E; --card:#FCF9F4; --card2:#F3ECE1; --line:#E2D6C6; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font:21px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif; }
  button { font:inherit; font-weight:700; border:2px solid var(--line); background:var(--card); color:var(--fg);
           border-radius:16px; padding:12px 16px; cursor:pointer; min-height:60px; }
  button:hover { border-color:var(--dim); }
  button:focus-visible { outline:4px solid var(--accent); outline-offset:3px; }
  button:active { transform:translateY(1px); }

  header { display:flex; gap:14px; align-items:center; padding:16px 24px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:12px; margin-right:auto; }
  .brand h1 { margin:0; font-size:34px; line-height:1; }
  #status { display:inline-flex; align-items:center; gap:10px; background:var(--card); border-radius:999px;
            padding:8px 16px; font-size:19px; font-weight:700; }
  #status::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--ok); }
  #status.down { color:var(--bad); } #status.down::before { background:var(--bad); }
  #mic { min-width:60px; }
  #mic.listening { background:var(--accent); color:#fff; border-color:var(--accent); }
  #stop { background:var(--stop); border-color:var(--stop); color:#fff; font-size:26px; min-width:150px; }
  #alarm { background:var(--bad); color:#fff; font-weight:700; font-size:24px; padding:14px 24px; }

  .wrap { padding:0 24px 24px; display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:24px;
          max-width:1600px; margin:0 auto; align-items:start; }
  .card { background:var(--card); border-radius:22px; padding:22px; min-width:0; }
  h2 { margin:0 0 14px; font-size:30px; line-height:1.2; }
  .sub { margin:-6px 0 16px; color:var(--dim); }

  /* camera */
  .cam { position:relative; background:#2b2622; border-radius:16px; overflow:hidden; width:fit-content; max-width:100%; margin:0 auto; }
  .cam img { display:block; max-width:100%; max-height:62vh; width:auto; height:auto; }
  .cam .ph { width:min(640px, 86vw); aspect-ratio:4/3; max-height:62vh; display:grid; place-items:center; color:#d8cfc4; }
  #boxes { position:absolute; inset:0; pointer-events:none; }
  .box { position:absolute; border:5px solid #fff; border-radius:8px; box-shadow:0 0 0 2px #000, inset 0 0 0 2px #000; }
  .box span { position:absolute; left:-5px; top:calc(100% + 4px); font-size:17px; font-weight:700; color:#1d1a17;
              padding:2px 10px; border-radius:8px; white-space:nowrap; box-shadow:0 0 0 2px #000; }
  .box.pill { border-color:var(--accent); box-shadow:0 0 0 2px #fff, inset 0 0 0 2px #fff; }
  .box.pill span { background:var(--accent); color:#fff; box-shadow:0 0 0 2px #fff; }
  .found { list-style:none; margin:16px 0 0; padding:0; display:grid; gap:8px; }
  .found li { display:flex; justify-content:space-between; gap:12px; background:var(--card2); border-radius:14px; padding:10px 16px; }
  .found li b { text-align:right; }
  .found .y b { color:var(--ok); } .found .n b { color:var(--bad); } .found .w b { color:var(--dim); }

  /* steps */
  .steps { display:flex; gap:8px; margin-bottom:18px; font-size:17px; font-weight:700; color:var(--dim); }
  .steps span { padding:4px 12px; border-radius:999px; background:var(--card2); }
  .steps span.on { background:var(--soft); color:var(--accent); }
  .days { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .days button { display:flex; align-items:center; gap:14px; text-align:left; font-size:24px; min-height:72px; }
  .days button.today { border-color:var(--accent); }
  .days button small { margin-left:auto; font-size:15px; color:var(--accent); }
  .swatch { width:34px; height:34px; border-radius:8px; flex:none; box-shadow:inset 0 0 0 2px rgba(0,0,0,.18); }
  .pills { display:grid; gap:12px; }
  .pills button { display:flex; align-items:center; gap:20px; text-align:left; min-height:96px; font-size:26px; }
  .pills button span.meta { display:block; font-size:17px; font-weight:400; color:var(--dim); }
  .icon { flex:none; display:inline-block; }
  .icon.round { width:52px; height:52px; border-radius:50%; box-shadow:inset -4px -4px 0 rgba(0,0,0,.15); }
  .icon.capsule { width:76px; height:34px; border-radius:17px; box-shadow:inset 0 0 0 2px #cfc5b8, inset -4px -4px 0 rgba(0,0,0,.06); }
  .icon-slot { width:76px; display:flex; justify-content:center; flex:none; }
  .back { margin-top:14px; background:transparent; border-color:transparent; color:var(--accent); min-height:48px; padding:6px 4px; }
  .done { display:flex; align-items:center; gap:20px; background:var(--soft); border-radius:18px; padding:20px; margin-bottom:16px; }
  .done b { font-size:30px; line-height:1.2; }
  .wide { width:100%; }

  .ask { display:flex; gap:10px; margin-top:20px; }
  .ask input { flex:1; min-width:0; font:inherit; color:var(--fg); background:#fff; border:2px solid var(--line);
               border-radius:16px; padding:12px 16px; min-height:60px; }
  .ask input:focus { outline:none; border-color:var(--accent); }
  .ask button { background:var(--accent); border-color:var(--accent); color:#fff; min-width:96px; }
  #heard { margin:10px 0 0; min-height:1.5em; color:var(--dim); font-size:19px; }
  #heard.ok { color:var(--ok); } #heard.bad { color:var(--bad); }
  footer { color:var(--dim); font-size:15px; text-align:center; padding:0 24px 24px; }

  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  @media (max-width:980px) { .wrap { grid-template-columns:1fr; } }
  @media (max-width:600px) { body { font-size:19px; } header { padding:12px 16px; } .wrap { padding:0 16px 16px; gap:16px; }
    .card { padding:16px; } .brand h1 { font-size:28px; } #stop { min-width:0; flex:1; } h2 { font-size:26px; }
    .days button { font-size:21px; min-height:64px; } .pills button { font-size:22px; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <clipPath id="cap"><rect x="4" y="14" width="36" height="16" rx="8"/></clipPath>
      <g clip-path="url(#cap)"><rect x="4" y="14" width="18" height="16" fill="#A64B2A"/><rect x="22" y="14" width="18" height="16" fill="#fff"/></g>
      <rect x="4" y="14" width="36" height="16" rx="8" fill="none" stroke="#3A322B" stroke-width="2"/>
    </svg>
    <h1>Doseday</h1>
  </div>
  <div id="status" role="status" aria-live="polite">Connecting…</div>
  <button id="mic" aria-label="Speak your answer">🎤</button>
  <button id="stop" aria-label="Stop the robot now">STOP</button>
</header>
<div id="alarm" role="alert" hidden></div>

<div class="wrap">
  <section class="card" aria-labelledby="cam-h">
    <h2 id="cam-h">What the camera sees</h2>
    <div class="cam">
      <img id="cam" alt="Camera view of the pill organizer and the pills" hidden>
      <div id="boxes"></div>
      <div class="ph" id="cam-ph">Waiting for the camera…</div>
    </div>
    <ul class="found" id="found"></ul>
  </section>

  <section class="card" aria-labelledby="q-h">
    <div class="steps"><span id="step-1">1 · Day</span><span id="step-2">2 · Pill</span></div>
    <div id="panel"></div>
    <form class="ask" id="cmd-form" autocomplete="off">
      <input id="cmd-text" aria-label="Type your answer" placeholder="Type a day, e.g. Monday">
      <button type="submit">Go</button>
    </form>
    <p id="heard" aria-live="polite"></p>
  </section>
</div>
<footer>Demo with candy and vitamins only. Not medical advice. Spooky Civic Hackathon 2026 · Team 02</footer>

<script>
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const NAMES = {sun:"Sunday",mon:"Monday",tue:"Tuesday",wed:"Wednesday",thu:"Thursday",fri:"Friday",sat:"Saturday"};
// mirrors selector.py; the server's copy in /status wins once it arrives
let DAY_COLORS = {sun:"#F47F8B",mon:"#F5C94E",tue:"#F4DF35",wed:"#A5E637",thu:"#7CBCE9",fri:"#35C9CE",sat:"#C58BE8"};
let PILLS = {"tums-orange":{name:"Orange Tums",color:"orange",shape:"round"},
             "tums-red":{name:"Red Tums",color:"red",shape:"round"},
             "magnesium":{name:"Magnesium",color:"white",shape:"capsule"}};
const SWATCH = {orange:"#F28C28", red:"#D2302F", white:"#fff"};
const FINDERS = {yolov8:"YOLOv8", blobs:"Blob finder"};
let view = null, shownKey = null, lastT = null;

function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; speechSynthesis.speak(u);
}

const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = p => `<span class="icon-slot"><span class="icon ${p.shape}" style="background:${SWATCH[p.color]}"></span></span>`;

async function post(path, body) {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})});
  return r.json().catch(() => ({}));
}

const STOP_TRIES = 3;
const STOP_FAILED = "STOP FAILED. The arm may still be moving.";

async function sendStop() {
  try {
    const r = await fetch("/stop", {method:"POST"});
    const j = await r.json().catch(() => ({}));
    return r.ok && j.ok === true;
  } catch (e) {
    return false;
  }
}

// "Stopped" is said only after the server confirms; a failure stays on screen until a stop succeeds.
async function stopArm() {
  say("Stopping");
  let done = false;
  for (let i = 0; i < STOP_TRIES && !done; i++) done = await sendStop();
  if (done) { showAlarm(""); say("Stopped"); return; }
  showAlarm(STOP_FAILED); say(STOP_FAILED);
}

function showAlarm(text) {
  const el = document.getElementById("alarm");
  el.textContent = text; el.hidden = !text;
}

function heard(text, ok) {
  const el = document.getElementById("heard");
  el.textContent = text; el.className = ok ? "ok" : "bad";
}

async function choose(body) {
  const j = await post("/select", body);
  if (j.say) { heard(j.say, j.ok); say(j.say); }
  poll(true);
  return j;
}

// Typed and spoken answers share one path; the server reads the day and the pill. A stop word always stops.
function run(text) {
  if (/\b(stop|halt|freeze)\b/i.test(text)) { heard("STOP", false); stopArm(); return; }
  return choose({text, today: new Date().getDay()});
}

function renderPanel() {
  const day = view && view.day, pill = view && view.pill;
  const key = `${!!view}|${day}|${pill}`;
  if (key === shownKey) return;
  shownKey = key;
  document.getElementById("step-1").className = day ? "" : "on";
  document.getElementById("step-2").className = day ? "on" : "";
  document.getElementById("cmd-text").placeholder = !day ? "Type a day, e.g. Monday" : "Type the pill, e.g. white capsule";
  const panel = document.getElementById("panel");
  const today = DAYS[new Date().getDay()];
  if (!day) {
    panel.innerHTML = `<h2 id="q-h">Which day?</h2><p class="sub">Pick the day to fill.</p><div class="days">${DAYS.map(d =>
      `<button data-day="${d}" class="${d === today ? "today" : ""}"><span class="swatch" style="background:${DAY_COLORS[d]}"></span>${NAMES[d]}${d === today ? "<small>Today</small>" : ""}</button>`).join("")}</div>`;
  } else if (!pill) {
    panel.innerHTML = `<h2 id="q-h">Which pill for ${NAMES[day]}?</h2><p class="sub">Choose by colour and shape.</p><div class="pills">${Object.entries(PILLS).map(([k, p]) =>
      `<button data-pill="${k}">${icon(p)}<span>${esc(p.name)}<span class="meta">${esc(p.color)} · ${esc(p.shape)}</span></span></button>`).join("")}</div>
      <button class="back" data-reset="1">← Change day</button>`;
  } else {
    const p = PILLS[pill];
    panel.innerHTML = `<h2 id="q-h">Ready</h2><div class="done">${icon(p)}<div><b>${esc(p.name)}</b><br>for ${NAMES[day]}</div></div>
      <button class="wide" data-reset="1">Start over</button>`;
  }
  panel.querySelectorAll("button").forEach(b => b.onclick = () =>
    b.dataset.reset ? choose({reset: true}) : b.dataset.day ? choose({day: b.dataset.day}) : choose({pill: b.dataset.pill}));
}

function boxHtml(d, cls, label, bg, size) {
  const [w, h] = size, [x0, y0, x1, y1] = d.box;
  return `<div class="box ${cls}" style="left:${x0 / w * 100}%;top:${y0 / h * 100}%;width:${(x1 - x0) / w * 100}%;height:${(y1 - y0) / h * 100}%">`
       + `<span${bg ? ` style="background:${bg}"` : ""}>${esc(label)}</span></div>`;
}

function renderCamera() {
  const boxes = document.getElementById("boxes"), found = document.getElementById("found");
  if (!view) { boxes.innerHTML = ""; found.innerHTML = `<li class="w"><span>Camera view</span><b>off</b></li>`; return; }
  const size = view.size || [640, 480];
  boxes.innerHTML = (view.day_boxes || []).map(d => boxHtml(d, "day", NAMES[view.day], DAY_COLORS[view.day], size)).join("")
                  + (view.pill_boxes || []).map(d => boxHtml(d, "pill", `${d.label}${d.source === "yolov8" ? ` ${Math.round(d.confidence * 100)}%` : ""}`, null, size)).join("");
  const rows = [];
  if (view.day) {
    const n = (view.day_boxes || []).length;
    rows.push(view.pointing ? `<li class="w"><span>Viam colour detector</span><b>looking for ${NAMES[view.day]}'s colour…</b></li>`
      : `<li class="${n ? "y" : "n"}"><span>Viam colour detector</span><b>${n ? `${NAMES[view.day]} found` : `${NAMES[view.day]} not in view`}</b></li>`);
  }
  if (view.pill) {
    const n = (view.pill_boxes || []).length, name = PILLS[view.pill].name;
    rows.push(`<li class="${n ? "y" : "n"}"><span>${FINDERS[view.pill_source] || esc(view.pill_source)}</span><b>${n ? `${esc(name)} found` : `no ${esc(name)} in view`}</b></li>`);
  }
  if (view.error) rows.push(`<li class="n"><span>Camera</span><b>${esc(view.error)}</b></li>`);
  found.innerHTML = rows.join("");
  if (view.t && view.t !== lastT) {
    lastT = view.t;
    document.getElementById("cam").src = `/frame.jpg?t=${view.t}`;
  }
}

async function poll(once) {
  try {
    const s = await (await fetch("/status")).json();
    view = s.view || null;
    if (view && view.days) DAY_COLORS = view.days;
    if (view && view.pills) PILLS = view.pills;
    const st = document.getElementById("status");
    st.textContent = s.busy ? `Arm working: ${s.busy.action}` : "Ready";
    st.className = "";
    renderPanel();
    renderCamera();
  } catch (e) {
    document.getElementById("status").textContent = "Robot server not reachable";
    document.getElementById("status").className = "down";
  }
  if (once !== true) setTimeout(poll, 500);
}

function build() {
  document.getElementById("stop").onclick = stopArm;
  const cam = document.getElementById("cam");
  cam.onerror = () => { cam.hidden = true; document.getElementById("cam-ph").hidden = false; };
  cam.onload = () => { cam.hidden = false; document.getElementById("cam-ph").hidden = true; };
  const box = document.getElementById("cmd-text");
  document.getElementById("cmd-form").onsubmit = e => {
    e.preventDefault();
    const text = (box.value || "").trim();
    if (!text) return;
    box.value = "";
    run(text);
  };
}

function setupMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic");
  if (!SR) { mic.disabled = true; mic.hidden = true; return; }
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
  rec.onresult = e => run(e.results[0][0].transcript);
  rec.onend = () => mic.classList.remove("listening");
  mic.onclick = () => { mic.classList.add("listening"); rec.start(); };
}

build(); setupMic(); poll();
</script>
</body>
</html>
